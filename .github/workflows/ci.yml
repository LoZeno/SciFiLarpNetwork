name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  dotnet-tests:
    name: .NET tests
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__EventStore: Host=localhost;Port=5432;Database=scifilarnetwork_tests;Username=postgres;Password=postgres
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: scifilarnetwork_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scifilarnetwork_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test solution
        run: dotnet test SciFiLarpNetwork.slnx --configuration Release
      - name: Upload .NET coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage
          path: |
            Backend/tests/**/TestResults/coverage/*.cobertura.*.xml
            Backend/tests/**/TestResults/coverage/*.json
            Management/tests/**/TestResults/coverage/*.cobertura.*.xml
            Management/tests/**/TestResults/coverage/*.json
          if-no-files-found: error

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Upload TypeScript coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/coverage/
          if-no-files-found: error
