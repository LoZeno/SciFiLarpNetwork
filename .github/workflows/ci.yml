name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  dotnet-unit-tests:
    name: .NET unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test every project except the integration tests
        run: |
          status=0
          for project in $(git ls-files '*/tests/*.csproj' | grep -v 'Integration.Tests'); do
            dotnet test --project "$project" --configuration Release || status=1
          done
          exit $status
      - name: Upload unit test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-unit-coverage
          path: |
            Backend/tests/**/TestResults/coverage/*.cobertura.*.xml
            Backend/tests/**/TestResults/coverage/*.json
            Management/tests/**/TestResults/coverage/*.cobertura.*.xml
            Management/tests/**/TestResults/coverage/*.json
          if-no-files-found: error

  dotnet-integration-tests:
    name: .NET integration tests
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__EventStore: Host=localhost;Port=5432;Database=scifilarnetwork_tests;Username=postgres;Password=postgres
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: scifilarnetwork_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scifilarnetwork_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test the integration project
        run: dotnet test --project Backend/tests/SciFiLarpNetwork.Backend.Integration.Tests --configuration Release
      - name: Upload integration test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-integration-coverage
          path: |
            Backend/tests/SciFiLarpNetwork.Backend.Integration.Tests/TestResults/coverage/*.cobertura.*.xml
            Backend/tests/SciFiLarpNetwork.Backend.Integration.Tests/TestResults/coverage/*.json
          if-no-files-found: error

  # The 80% gate applies to the combined coverage of both test jobs, so it runs once both have uploaded theirs.
  dotnet-coverage:
    name: .NET coverage
    needs: [dotnet-unit-tests, dotnet-integration-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore .NET tools
        run: dotnet tool restore
      - name: Download unit test coverage
        uses: actions/download-artifact@v8
        with:
          name: dotnet-unit-coverage
          path: coverage-input/unit
      - name: Download integration test coverage
        uses: actions/download-artifact@v8
        with:
          name: dotnet-integration-coverage
          path: coverage-input/integration
      - name: Merge .NET coverage reports and enforce 80% line coverage
        run: |
          dotnet reportgenerator \
            "-reports:coverage-input/**/*.cobertura.*.xml" \
            "-targetdir:coverage/dotnet" \
            "-reporttypes:Cobertura;HtmlSummary;MarkdownSummaryGithub;TextSummary" \
            "minimumCoverageThresholds:lineCoverage=80"
      - name: Publish .NET coverage summary
        if: always()
        run: cat coverage/dotnet/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload .NET coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-coverage
          path: coverage/dotnet/
          if-no-files-found: error

  # Card PDFs come from the Typst build bundled per runtime, so each supported RID is exercised on its own runner.
  card-printing-platforms:
    name: Card printing (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      ConnectionStrings__EventStore: Host=localhost;Port=5432;Database=scifilarnetwork_tests;Username=postgres;Password=postgres
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Docker service containers exist only on Linux runners; this action installs PostgreSQL on every OS.
      - name: Start PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@325155bfd7807b2a21ac9c2c7bb9b9a6eacc44df # v9
        with:
          database: scifilarnetwork_tests
          postgres-version: "18"
      - name: Build integration tests
        run: dotnet build Backend/tests/SciFiLarpNetwork.Backend.Integration.Tests --configuration Release
      - name: Check the bundled Typst
        run: |
          typst=Backend/tests/SciFiLarpNetwork.Backend.Integration.Tests/bin/Release/net10.0/tools/typst/typst
          if [ -f "$typst.exe" ]; then typst="$typst.exe"; fi
          "$typst" --version
      - name: Character card API tests
        run: >-
          dotnet Backend/tests/SciFiLarpNetwork.Backend.Integration.Tests/bin/Release/net10.0/SciFiLarpNetwork.Backend.Integration.Tests.dll
          -class "SciFiLarpNetwork.Backend.Tests.Integration.CharacterCards.CharacterCardsApiTests"

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Upload TypeScript coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: Frontend/coverage/
          if-no-files-found: error
