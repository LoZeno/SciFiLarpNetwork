name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  dotnet-tests:
    name: .NET tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test solution
        run: dotnet test SciFiLarpNetwork.slnx --configuration Release
      - name: Upload .NET coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage
          path: |
            Backend/tests/**/TestResults/coverage/coverage.cobertura.xml
            Backend/tests/**/TestResults/coverage/coverage.json
            Management/tests/**/TestResults/coverage/coverage.cobertura.xml
            Management/tests/**/TestResults/coverage/coverage.json
          if-no-files-found: error

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Upload TypeScript coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/coverage/
          if-no-files-found: error
