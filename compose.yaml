services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: scifilarnetwork_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deployment/development/10-create-test-database.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scifilarnetwork_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: